<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCHS project map — v0.1</title>
<style>
  body { font-family: sans-serif; background: #f1efe8; color: #2c2c2a; padding: 2rem; }
  button, select { padding: 6px 12px; border-radius: 6px; border: 1px solid #b4b2a9; background: white; }
  .panels { display: flex; gap: 16px; margin-top: 1rem; align-items: flex-start; }
  .panel-col { flex: 1 1 50%; display: flex; flex-direction: column; }
  .panel-col h3 { margin: 0 0 8px; font-size: 15px; }
  #floor-view { flex: none; }
  
  #floor-view { position: relative; width: 100%; aspect-ratio: 165 / 305;
              background: #fff; border-radius: 8px; border: 1px solid #b4b2a9; overflow: hidden; }
  #tree-view {  display: flex; flex-direction: column; gap: 12px; }
  .tree-col { background: #f1efe8; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px; }
  .tree-col.items { display: flex; flex-wrap: wrap; gap: 8px; }
  .tree-col h4 { margin: 0; font-size: 13px; color: #5f5e5a; min-width: 90px; }
  .tree-item { padding: 6px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 6px;
               background: #eeedfe; color: #26215c; cursor: pointer; border: 2px solid transparent; }
  .tree-item.selected { border-color: #534ab7; }
  .bubble { position: absolute; width: 100px; padding: 6px 8px; border-radius: 12px;
            font-size: 12px; text-align: center; color: #26215c; background: #eeedfe;
            border: 2px solid transparent; transform: translate(-50%, -50%); z-index: 2; }
  .bubble.selected { border-color: #534ab7; }
  .pin { position: absolute; width: 8px; height: 8px; border-radius: 50%;
         background: #534ab7; transform: translate(-50%, -50%); z-index: 2; }
  svg.connectors { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
</style>
</head>
<body>

<h2>CCHS project map — v0.2</h2>

<div class="panels">
  <div class="panel-col">
    <h3>Floor plan</h3>
    <div id="coord-readout" style="font-size:13px; color:#5f5e5a; margin-bottom:6px;">
		Click the map to read coordinates
	</div>
	<div id="floor-view">
		<object type="image/svg+xml" data="/static/CCHS_map_fixed.svg" style="position:absolute; inset:0; width:100%; height:100%;"></object>
		<svg id="overlay" viewBox="320 -10 165 305" style="position:absolute; inset:0; width:100%; height:100%;"></svg>
	</div>
  </div>
  
  
  <div class="panel-col">
    <h3>
      Project tree
      <select id="axis" onchange="render()" style="margin-left: 8px;">
        <option value="type">Type</option>
        <option value="recency">Recency</option>
        <option value="specs">Specs</option>
      </select>
    </h3>
    <div id="tree-view"></div>
  </div>
</div>


<script>
let projects = [];
let selected = null;

function labelOffset(p) {
  return { lx: p.x + 60, ly: p.y - 30 };
}

function selectProject(name) {
  selected = (selected === name) ? null : name;
  render();
}

function render() {
  const svgns = "http://www.w3.org/2000/svg";
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = '';

  projects.forEach(p => {
    const pin = document.createElementNS(svgns, 'circle');
    pin.setAttribute('cx', p.x); pin.setAttribute('cy', p.y); pin.setAttribute('r', 1.2);
    pin.setAttribute('fill', '#534ab7');
    overlay.appendChild(pin);

    const line = document.createElementNS(svgns, 'line');
    line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
    line.setAttribute('x2', p.label_x); line.setAttribute('y2', p.label_y);
    line.setAttribute('stroke', '#b4b2a9'); line.setAttribute('stroke-width', '1.');
    overlay.appendChild(line);

    const label = document.createElementNS(svgns, 'text');
    label.setAttribute('x', p.label_x); label.setAttribute('y', p.label_y);
    label.setAttribute('font-size', '5'); label.setAttribute('fill', '#26215c');
    label.textContent = p.name;
    label.style.cursor = 'pointer';
    label.onclick = () => selectProject(p.name);
    overlay.appendChild(label);
  });

  const axis = document.getElementById('axis').value;
  const groups = {};
  projects.forEach(p => {
    const keys = axis === 'specs' ? (p.specs || []) : [p[axis]];
    keys.forEach(k => { (groups[k] = groups[k] || []).push(p); });
  });

  const tree = document.getElementById('tree-view');
  tree.innerHTML = '';
  Object.keys(groups).forEach(k => {
    const col = document.createElement('div');
    col.className = 'tree-col';
    const h = document.createElement('h4');
    h.textContent = k;
    col.appendChild(h);
    const itemsRow = document.createElement('div');
    itemsRow.className = 'items';
    groups[k].forEach(p => {
      const item = document.createElement('div');
      item.className = 'tree-item' + (selected === p.name ? ' selected' : '');
      item.textContent = p.name;
      item.onclick = () => selectProject(p.name);
      itemsRow.appendChild(item);
    });
    col.appendChild(itemsRow);
    tree.appendChild(col);
  });
}

document.getElementById('overlay').addEventListener('click', function(e) {
  const svg = e.currentTarget;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
  const x = svgP.x.toFixed(1);
  const y = svgP.y.toFixed(1);
  document.getElementById('coord-readout').textContent = `x: ${x}, y: ${y}`;
  
  // remove the previous click marker, if any
  const old = document.getElementById('click-marker');
  if (old) old.remove();

  // draw a new one at the clicked point
  const svgns = "http://www.w3.org/2000/svg";
  const dot = document.createElementNS(svgns, 'circle');
  dot.setAttribute('id', 'click-marker');
  dot.setAttribute('cx', svgP.x);
  dot.setAttribute('cy', svgP.y);
  dot.setAttribute('r', 1.5);
  dot.setAttribute('fill', '#c0392b');
  svg.appendChild(dot);
});

fetch('/api/projects')
  .then(r => r.json())
  .then(data => { projects = data; render(); });
</script>
</body>
</html>
