<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCHS project map — v0.5</title>
<style>
  body { font-family: sans-serif; background: #f1efe8; color: #2c2c2a; padding: 2rem; }
  button, select { padding: 6px 12px; border-radius: 6px; border: 1px solid #b4b2a9; background: white; }
  .panels { display: flex; gap: 16px; margin-top: 1rem; align-items: flex-start; }
  .panel-col { flex: 1 1 50%; display: flex; flex-direction: column; }
  .panel-col h3 { margin: 0 0 8px; font-size: 15px; }
  #floor-view { flex: none; }
  
  #floor-view { position: relative; width: 100%; aspect-ratio: 165 / 305;
              background: #fff; border-radius: 8px; border: 1px solid #b4b2a9; overflow: hidden; }
  #tree-view {  display: flex; flex-direction: column; gap: 12px; }
  .tree-col { background: #f1efe8; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px; }
  .tree-col.items { display: flex; flex-wrap: wrap; gap: 8px; }
  .tree-col h4 { margin: 0; font-size: 13px; color: #5f5e5a; min-width: 90px; }
  .tree-item { padding: 6px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 6px;
               background: #eeedfe; color: #26215c; cursor: pointer; border: 2px solid transparent; }
  .tree-item.selected { border-color: #534ab7; }
  .bubble { position: absolute; width: 100px; padding: 6px 8px; border-radius: 12px;
            font-size: 12px; text-align: center; color: #26215c; background: #eeedfe;
            border: 2px solid transparent; transform: translate(-50%, -50%); z-index: 2; }
  .bubble.selected { border-color: #534ab7; }
  .pin { position: absolute; width: 8px; height: 8px; border-radius: 50%;
         background: #534ab7; transform: translate(-50%, -50%); z-index: 2; }
  svg.connectors { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  
  .panel-header { min-height: 48px; display: flex; flex-direction: column;
    justify-content: flex-end; margin-bottom: 8px; }

  .tree-root-bubble {
    border-radius: 20px; background: #f3f1fb; padding: 14px; text-align: center;
  }
  .tree-root-bubble > .root-label {
    font-weight: 700; font-size: 15px; color: #2c2c2a; margin-bottom: 10px;
  }
  .primary-bubble {
    background: #ddd6f7; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px;
    text-align: left;
  }
  .secondary-bubble {
    background: #b8a9ec; border-radius: 12px; padding: 8px 10px; margin: 6px 0;
  }
  .branch-header { font-weight: 700; font-size: 13px; color: #26215c; cursor: pointer; margin-bottom: 6px; }
  .branch-header.sub { font-weight: 600; font-size: 12px; color: #2c2c2a; margin-bottom: 4px; }
  .branch-header::before { content: "▾ "; }
  .branch-header.collapsed::before { content: "▸ "; }
  .tree-children.collapsed { display: none; }
  
  .leaf-wrap { display: flex; flex-direction: column; gap: 6px; }
  
  .tree-item { padding: 6px 10px; border-radius: 8px; font-size: 13px;
    background: #7d64d1; color: #fff; cursor: pointer; border: 2px solid transparent; }
  .tree-item.highlighted {
    border-color: #f0c419;
    border-width: 3px;
    font-weight: 700;
  }
 
  
  
  .tree-item-wrap.dimmed { opacity: 0.3; }
  .tree-item-detail {
    background: #fff; border-radius: 8px; padding: 8px 10px; margin-top: 4px;
    font-size: 12px; color: #2c2c2a;
  }
  .tree-item-detail .image-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tree-item-detail .image-strip img { max-width: 140px; max-height: 140px; object-fit: cover; border-radius: 6px; }
  
  .tree-controls {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    margin-bottom: 1.5em;
  }

</style>
</head>
<body>

<h2>CCHS project map — v0.5</h2>

<div class="panels">
  <div class="panel-col">
    <h3>Floor plan</h3>
    <div id="coord-readout" style="font-size:13px; color:#5f5e5a; margin-bottom:6px;">
		Click the map to read coordinates
	</div>
	<div id="floor-view">
		<object type="image/svg+xml" data="/static/CCHS_map_fixed.svg" style="position:absolute; inset:0; width:100%; height:100%;"></object>
		<svg id="overlay" viewBox="320 -10 165 305" style="position:absolute; inset:0; width:100%; height:100%;"></svg>
	</div>
  </div>
  
  
  <div class="panel-col">
    <div class="panel-header">
      <strong>Tree by</strong>
      <span> <span>
      <span> <span>
      <select id="primary-axis" onchange="render()">
        <option value="type">Type</option>
        <option value="recency">Recency</option>
        <option value="zone">Zone</option>
      </select>
      <span>then</span>
      <select id="secondary-axis" onchange="render()">
        <option value="type">Type</option>
        <option value="recency">Recency</option>
        <option value="zone">Zone</option>
      </select>
    </div>
    <div id="tree-view"></div>
    <div id="detail-panel" class="detail-panel" style="display:none;"></div>
  </div>
</div>


<script>
let projects = [];

const RECENCY_ORDER = ['current', 'living-memory', 'eons-past',];
//const FUN_FACTOR = ['']

function sortedKeys(obj, orderList) {
  return Object.keys(obj).sort((a, b) => {
    const ia = orderList.indexOf(a), ib = orderList.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

function toggleBranch(headerEl) {
  headerEl.nextElementSibling.classList.toggle('collapsed');
}

let expanded = new Set();

function toggleExpand(name, e) {
  e.stopPropagation();
  if (expanded.has(name)) expanded.delete(name);
  else expanded.add(name);
  render();
}

function buildTree(primaryAxis, secondaryAxis) {
  const tree = {};
  projects.forEach(p => {
    const a = p[primaryAxis] || 'unspecified';
    const b = p[secondaryAxis] || 'unspecified';
    tree[a] = tree[a] || {};
    tree[a][b] = tree[a][b] || [];
    tree[a][b].push(p);
  });
  return tree;
}

function renderTree() {
  const container = document.getElementById('tree-view');
  container.innerHTML = '';

  const rootBubble = document.createElement('div');
  rootBubble.className = 'tree-root-bubble';

  const rootLabel = document.createElement('div');
  rootLabel.className = 'root-label';
  rootLabel.textContent = 'Aedificamus communitatem';
  rootBubble.appendChild(rootLabel);

  const primaryAxis = document.getElementById('primary-axis').value;
  let secondaryAxis = document.getElementById('secondary-axis').value;
  if (secondaryAxis === primaryAxis) {
    // fall back to the first non-matching option
    secondaryAxis = ['type', 'recency', 'zone'].find(a => a !== primaryAxis);
  }

  const tree = buildTree(primaryAxis, secondaryAxis);
  const primaryOrder = primaryAxis === 'recency' ? RECENCY_ORDER : null;
  const primaryKeys = primaryOrder ? sortedKeys(tree, primaryOrder) : Object.keys(tree).sort();

  primaryKeys.forEach(pKey => {
    const pBubble = document.createElement('div');
    pBubble.className = 'primary-bubble';
    const pHeader = document.createElement('div');
    pHeader.className = 'branch-header';
    pHeader.textContent = pKey;
    pHeader.onclick = () => toggleBranch(pHeader);
    pBubble.appendChild(pHeader);

    const pChildren = document.createElement('div');
    pChildren.className = 'tree-children';

    const secondaryOrder = secondaryAxis === 'recency' ? RECENCY_ORDER : null;
    const secondaryKeys = secondaryOrder
      ? sortedKeys(tree[pKey], secondaryOrder)
      : Object.keys(tree[pKey]).sort();

    secondaryKeys.forEach(sKey => {
      const sBubble = document.createElement('div');
      sBubble.className = 'secondary-bubble';
      const sHeader = document.createElement('div');
      sHeader.className = 'branch-header sub';
      sHeader.textContent = sKey;
      sHeader.onclick = () => toggleBranch(sHeader);
      sBubble.appendChild(sHeader);

      const leafWrap = document.createElement('div');
      leafWrap.className = 'tree-children leaf-wrap';

      tree[pKey][sKey]
        .sort((a, b) => {
          const da = a.date_built, db = b.date_built;
          if (!da && !db) return a.name.localeCompare(b.name);
          if (!da) return 1;
          if (!db) return -1;
          return da.localeCompare(db);
        })
        .forEach(p => {
          const isHighlighted = expanded.has(p.name);

          const wrap = document.createElement('div');
          wrap.className = 'tree-item-wrap';

          const item = document.createElement('div');
          item.className = 'tree-item' + (isHighlighted ? ' highlighted' : '');
          item.onclick = (e) => toggleExpand(p.name, e);

          const label = document.createElement('span');
          label.textContent = p.name;
          item.appendChild(label);

          wrap.appendChild(item);

          if (isHighlighted) {
            const detail = document.createElement('div');
            detail.className = 'tree-item-detail';
            let html = '<p>' + (p.description || '') + '</p>';
            if (p.link) html += '<a href="' + p.link + '" target="_blank">' + p.link + '</a>';
            if (p.images && p.images.length) {
              html += '<div class="image-strip">' +
                p.images.map(img => '<img src="static/images/' + img + '">').join('') +
                '</div>';
            }
            detail.innerHTML = html;
            wrap.appendChild(detail);
          }

          leafWrap.appendChild(wrap);
        });

      sBubble.appendChild(leafWrap);
      pChildren.appendChild(sBubble);
    });
    pBubble.appendChild(pChildren);
    rootBubble.appendChild(pBubble);
  });

  container.appendChild(rootBubble);
}

function render() {
  const svgns = "http://www.w3.org/2000/svg";
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = '';

  projects.forEach(p => {
    const isHighlighted = expanded.has(p.name);

    const pin = document.createElementNS(svgns, 'circle');
    pin.setAttribute('cx', p.x); pin.setAttribute('cy', p.y);
    pin.setAttribute('r', isHighlighted ? '2' : '1.2');
    pin.setAttribute('fill', isHighlighted ? '#FF4747' : '#534ab7');
    pin.setAttribute('stroke', isHighlighted ? '#FF8000' : 'none');
    pin.setAttribute('stroke-width', '0.4');
    pin.style.cursor = 'pointer';
    pin.onclick = (e) => toggleExpand(p.name, e);
    overlay.appendChild(pin);

    const line = document.createElementNS(svgns, 'line');
    line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
    line.setAttribute('x2', p.label_x); line.setAttribute('y2', p.label_y);
    line.setAttribute('stroke', isHighlighted ? '#FF8000' : '#b4b2a9');
    line.setAttribute('stroke-width', isHighlighted ? '0.6' : '0.3');
    overlay.appendChild(line);

    const label = document.createElementNS(svgns, 'text');
    label.setAttribute('x', p.label_x); label.setAttribute('y', p.label_y);
    label.setAttribute('font-size', isHighlighted ? '4.5' : '3.5');
    label.setAttribute('font-weight', isHighlighted ? '700' : '400');
    label.setAttribute('fill', isHighlighted ? '#FF8000' : '#26215c');
    label.textContent = p.name;
    label.style.cursor = 'pointer';
    label.onclick = (e) => toggleExpand(p.name, e);
    overlay.appendChild(label);
  });

  renderTree();
}

document.getElementById('overlay').addEventListener('click', function(e) {
  const svg = e.currentTarget;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
  const x = svgP.x.toFixed(1);
  const y = svgP.y.toFixed(1);
  document.getElementById('coord-readout').textContent = `x: ${x}, y: ${y}`;
  
  // remove the previous click marker, if any
  const old = document.getElementById('click-marker');
  if (old) old.remove();

  // draw a new one at the clicked point
  const svgns = "http://www.w3.org/2000/svg";
  const dot = document.createElementNS(svgns, 'circle');
  dot.setAttribute('id', 'click-marker');
  dot.setAttribute('cx', svgP.x);
  dot.setAttribute('cy', svgP.y);
  dot.setAttribute('r', 1.5);
  dot.setAttribute('fill', '#FF4747'); //FF4747
  svg.appendChild(dot);
});

fetch('projects.json')
  .then(r => r.json())
  .then(data => { projects = data; render(); });
</script>
</body>
</html>
