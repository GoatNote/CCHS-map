<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCHS project map — v0.6</title>
<style>
  body { font-family: sans-serif; background: #f1efe8; color: #2c2c2a; padding: 2rem; }
  button, select { padding: 6px 12px; border-radius: 6px; border: 1px solid #b4b2a9; background: white; }
  .panels { display: flex; gap: 16px; margin-top: 1rem; align-items: flex-start; }
  .panel-col { flex: 1 1 50%; display: flex; flex-direction: column; }
  .panel-col h3 { margin: 0 0 8px; font-size: 15px; }
  #floor-view {
    position: relative;
    width: 90%;
    max-width: 90%;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    border: 1px solid #b4b2a9;
  }
  #filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filter-chip {
    padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer;
    background: #eeedfe; color: #26215c; border: 2px solid transparent;
  }
  .filter-chip.active { background: #534ab7; color: #fff; border-color: #26215c; }

  .filter-row { margin-bottom: 10px; }
  .filter-row-title { font-weight: 700; font-size: 12px; color: #5f5e5a; margin-bottom: 4px; }
  .filter-row-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .inline-pill {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    background: #534ab7; color: #fff; font-size: 12px; font-weight: 600;
    margin: 0 2px;
  }
  
  .qualifier { font-size: 11px; color: #999; font-style: italic; }
  
  .project-card {
    position: absolute; transform: translate(-50%, -50%);
    width: 140px; background: #fff; border-radius: 10px; padding: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15); cursor: pointer;
    pointer-events: auto; transition: opacity 0.15s;
    font-size: 12px; text-align: center;
  }
  .project-card img { width: 100%; height: 70px; object-fit: cover; border-radius: 6px; margin-bottom: 4px; }
  .project-card .card-name { font-weight: 700; color: #26215c; }
  .project-card.matched { opacity: 1; z-index: 5; }
  .project-card.unmatched { opacity: 0.25; z-index: 1; }
  .project-card .card-detail { margin-top: 6px; text-align: left; font-size: 11px; }
  .project-card .card-detail .image-strip { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .project-card .card-detail .image-strip img { width: 60px; height: 60px; }

  #match-count { font-size: 13px; margin-bottom: 12px; }
</style>

</head>
<body>

<h2>CCHS project map — v0.6</h2>
<div id="instructions" style="font-size:13px; color:#5f5e5a; margin-bottom:12px;">
  Click on labels to expand them. Labels are draggable! 
  Click filters to explore tagged projects.
  Update projects via git pull requests on the official repo (ask for more details if curious)
</div>
<div id="coord-readout" style="font-size:13px; color:#5f5e5a; margin-bottom:10px;">
  Click the map to read coordinates
</div>
<div id="filter-bar"></div>
<div id="match-count"></div>

<div id="floor-view" style="position:relative; width:100%;">
  <div id="basemap" style="position:absolute; inset:0;"></div>
  <svg id="overlay" style="position:relative; inset:0; width:100%; height:100%;"></svg>
  <div id="cards-layer" style="position:absolute; inset:0; pointer-events:none;"></div>
</div>


<script>
let projects = [];

//gather hardcoded aspect ratio stuff into one place.
const VIEW_X = 320, VIEW_Y = -10, VIEW_W = 165, VIEW_H = 500;
const VIEWBOX = VIEW_X + ' ' + VIEW_Y + ' ' + VIEW_W + ' ' + VIEW_H;

const RECENCY_ORDER = ['current', 'living-memory', 'eons-past',];
//const FUN_FACTOR = ['']

function sortedKeys(obj, orderList) {
  return Object.keys(obj).sort((a, b) => {
    const ia = orderList.indexOf(a), ib = orderList.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

function toggleBranch(headerEl) {
  headerEl.nextElementSibling.classList.toggle('collapsed');
}

let expanded = new Set();

function toggleExpand(name, e) {
  e.stopPropagation();
  if (expanded.has(name)) expanded.delete(name);
  else expanded.add(name);
  render();
}

let activeFilters = new Set();

function buildFilterOptions() {
  const values = new Set();
  projects.forEach(p => {
    [p.type, p.recency, p.zone].forEach(v => { if (v) values.add(v); });
  });
  return Array.from(values).sort();
}

function toggleFilter(value) {
  if (activeFilters.has(value)) activeFilters.delete(value);
  else activeFilters.add(value);
  render();
}

function buildFilterGroups() {
  const groups = { Type: new Set(), Recency: new Set(), Zone: new Set() };
  projects.forEach(p => {
    if (p.type) groups.Type.add(p.type);
    if (p.recency) groups.Recency.add(p.recency);
    if (p.zone) groups.Zone.add(p.zone);
  });
  return groups;
}

function renderFilterBar() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  const groups = buildFilterGroups();

  Object.keys(groups).forEach(label => {
    if (groups[label].size === 0) return;
    const row = document.createElement('div');
    row.className = 'filter-row';

    const title = document.createElement('div');
    title.className = 'filter-row-title';
    title.textContent = label;
    row.appendChild(title);

    const chipsWrap = document.createElement('div');
    chipsWrap.className = 'filter-row-chips';
    Array.from(groups[label]).sort().forEach(value => {
      const chip = document.createElement('div');
      chip.className = 'filter-chip' + (activeFilters.has(value) ? ' active' : '');
      chip.textContent = value;
      chip.onclick = () => toggleFilter(value);
      chipsWrap.appendChild(chip);
    });
    row.appendChild(chipsWrap);
    bar.appendChild(row);
  });
}

function projectMatches(p) {
  if (activeFilters.size === 0) return true;
  const tags = [p.type, p.recency, p.zone];
  return Array.from(activeFilters).every(f => tags.includes(f));
}

function toPercent(x, y) {
  return {
    left: ((x - VIEW_X) / VIEW_W) * 100,
    top: ((y - VIEW_Y) / VIEW_H) * 100
  };
}

function toSvgCoords(leftPct, topPct) {
  return {
    x: VIEW_X + (leftPct / 100) * VIEW_W,
    y: VIEW_Y + (topPct / 100) * VIEW_H  // note: should be topPct, check below
  };
}

function renderCards() {
  const layer = document.getElementById('cards-layer');
  layer.innerHTML = '';

  projects.forEach(p => {
    const isMatched = projectMatches(p);
    const isExpanded = expanded.has(p.name);
    const pos = dragOffsets.get(p.name) || toPercent(p.label_x, p.label_y);
    


    const card = document.createElement('div');
    card.style.left = pos.left + '%';
    card.style.top = pos.top + '%'; 
    card.className = 'project-card ' + (isMatched ? 'matched' : 'unmatched');
    card.style.left = pos.left + '%';
    card.style.top = pos.top + '%';
    makeCardDraggable(card, p);
    if (isExpanded) {
      topZ++;
      card.style.zIndex = topZ;
    }

    let html = '';
    if (p.images && p.images.length) {
      html += '<img src="' + IMAGES_BASE_URL + p.images[0] + '">';
    }
    html += '<div class="card-name">' + p.name + '</div>';

    if (isExpanded) {
      html += '<div class="card-detail">';
      html += '<p>' + (p.description || '') + '</p>';
      if (p.link) html += '<a href="' + p.link + '" target="_blank">' + p.link + '</a>';
      if (p.images && p.images.length) {
        html += '<div class="image-strip">' +
          p.images.map(img => '<img src="' + IMAGES_BASE_URL + img + '">').join('') +
          '</div>';
      }
      html += '</div>';
    }

    card.innerHTML = html;
    layer.appendChild(card);
  });
}

let dragOffsets = new Map();
let topZ = 10;

function makeCardDraggable(card, p) {
  let dragging = false;
  let startX, startY, startLeft, startTop;
  const layer = document.getElementById('cards-layer');

  card.addEventListener('mousedown', (e) => {
    dragging = false;
    startX = e.clientX;
    startY = e.clientY;
    const rect = layer.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();
    startLeft = ((cardRect.left + cardRect.width / 2) - rect.left) / rect.width * 100;
    startTop = ((cardRect.top + cardRect.height / 2) - rect.top) / rect.height * 100;

    function onMove(e2) {
      const dx = e2.clientX - startX;
      const dy = e2.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        if (!dragging) {
          dragging = true;
          topZ++;
          card.style.zIndex = topZ;
        }
        const rect2 = layer.getBoundingClientRect();
        const newLeft = startLeft + (dx / rect2.width) * 100;
        const newTop = startTop + (dy / rect2.height) * 100;
        card.style.left = newLeft + '%';
        card.style.top = newTop + '%';
        dragOffsets.set(p.name, { left: newLeft, top: newTop });
        
        const svgPos = toSvgCoords(newLeft, newTop);
        const line = document.getElementById('line-' + p.name.replace(/\s+/g, '-'));
        if (line) {
          line.setAttribute('x2', svgPos.x);
          line.setAttribute('y2', svgPos.y);
}
      }
    }

    function onUp(e2) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (!dragging) {
        // treat as a click, not a drag
        toggleExpand(p.name, e2);
      }
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function sizeFloorView() {
  const floorView = document.getElementById('floor-view');
  const width = floorView.clientWidth;
  floorView.style.height = (width * (VIEW_H / VIEW_W)) + 'px';
}
window.addEventListener('resize', sizeFloorView);

function render() {
  const svgns = "http://www.w3.org/2000/svg";
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = '';

  projects.forEach(p => {
    const isMatched = projectMatches(p);
    const dragged = dragOffsets.get(p.name);
    const labelSvg = dragged ? toSvgCoords(dragged.left, dragged.top) : { x: p.label_x, y: p.label_y };

    const pin = document.createElementNS(svgns, 'circle');
    pin.setAttribute('cx', p.x); pin.setAttribute('cy', p.y); pin.setAttribute('r', '1.2');
    pin.setAttribute('fill', '#534ab7');
    pin.setAttribute('opacity', isMatched ? '1' : '0.25');
    overlay.appendChild(pin);

    const line = document.createElementNS(svgns, 'line');
    line.setAttribute('id', 'line-' + p.name.replace(/\s+/g, '-'));
    line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
    line.setAttribute('x2', labelSvg.x); line.setAttribute('y2', labelSvg.y);
    line.setAttribute('stroke', '#b4b2a9'); line.setAttribute('stroke-width', '0.3');
    line.setAttribute('opacity', isMatched ? '1' : '0.25');
    overlay.appendChild(line);
  });
  renderFilterBar();

  const matchCount = projects.filter(projectMatches).length;
  const countEl = document.getElementById('match-count');

  let html;
  if (activeFilters.size === 0) {
    html = 'There ' + (matchCount === 1 ? 'is ' : 'are ') + matchCount + ' project' + (matchCount === 1 ? '' : 's') + ' (documented) in the space';
  } else {
    const pillsHtml = Array.from(activeFilters)
      .map(f => '<span class="inline-pill">' + f + '</span>')
      .join(' ');
    html = 'There ' + (matchCount === 1 ? 'is ' : 'are ') + matchCount + ' ' + pillsHtml + ' project' + (matchCount === 1 ? '' : 's') + ' (documented) in the space';
  }

  if (matchCount === 0) {
    html += '<br><span class="qualifier">(this may be as a result of a category error, difference of opinion, and/or lack of documentation)</span>';
  }

  countEl.innerHTML = html;
  countEl.style.color = matchCount === 0 ? '#c0392b' : '#5f5e5a';

  renderCards();
}

document.getElementById('overlay').setAttribute('viewBox', VIEWBOX);

document.getElementById('overlay').addEventListener('click', function(e) {
  const svg = e.currentTarget;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
  const x = svgP.x.toFixed(1);
  const y = svgP.y.toFixed(1);
  document.getElementById('coord-readout').textContent = `x: ${x}, y: ${y}`;
  
  // remove the previous click marker, if any
  const old = document.getElementById('click-marker');
  if (old) old.remove();

  // draw a new one at the clicked point
  const svgns = "http://www.w3.org/2000/svg";
  const dot = document.createElementNS(svgns, 'circle');
  dot.setAttribute('id', 'click-marker');
  dot.setAttribute('cx', svgP.x);
  dot.setAttribute('cy', svgP.y);
  dot.setAttribute('r', 1.5);
  dot.setAttribute('fill', '#FF4747'); //FF4747
  svg.appendChild(dot);
});

const MAP_URL = 'https://raw.githubusercontent.com/GoatNote/CCHS-map/refs/heads/main/static/CCHS_map_fixed.svg';
const IMAGES_BASE_URL = 'https://raw.githubusercontent.com/GoatNote/CCHS-map/refs/heads/main/static/images/';



// raw.githubusercontent.com sends X-Frame-Options: deny, so the map cannot be
// embedded with <object>/<iframe>. Fetch it (CORS is open) and inline it instead,
// re-framing it onto the overlay's viewBox so the pins line up.
fetch(MAP_URL)
  .then(r => r.text())
  .then(text => {
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const svg = doc.documentElement;
    if (svg.nodeName === 'parsererror') throw new Error('map SVG did not parse');
    svg.setAttribute('viewBox', VIEWBOX);
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.setAttribute('style', 'position:absolute; inset:0; width:100%; height:100%;');
    document.getElementById('basemap').appendChild(document.importNode(svg, true));
  })
  .catch(err => console.error('floor plan failed to load:', err));

sizeFloorView();

fetch('https://raw.githubusercontent.com/GoatNote/CCHS-map/refs/heads/main/projects.json')
  .then(r => r.json())
  .then(data => { projects = data; render(); });
</script>
</body>
</html>
